<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#dff0f7">
<title>Around Woolacombe</title>
<style>
:root{
  --bg:#f7f4ee; --card:#ffffff; --card2:#f0ece3; --sep:#e5e0d5;
  --label:#20242c; --sec:#6f6a5e; --ter:#a39d8f;
  --blue:#0077b6; --green:#178a45; --orange:#e07b1f; --red:#c0392b;
  --yellow:#b45309; --purple:#7c3aed; --teal:#0891b2; --pink:#d6336c;
  --tab:78px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:linear-gradient(180deg,#dff0f7 0%,#f2efe7 130px,var(--bg) 260px);margin:0;padding:0;background:var(--bg);color:var(--label);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body{padding-bottom:calc(var(--tab) + env(safe-area-inset-bottom))}

header{padding:calc(env(safe-area-inset-top) + 14px) 20px 8px;
  padding-left:calc(20px + env(safe-area-inset-left));
  padding-right:calc(20px + env(safe-area-inset-right))}
h1{font-size:33px;line-height:1.1;font-weight:700;letter-spacing:-.6px;margin:0}
.sub{color:var(--sec);font-size:14px;margin-top:5px;line-height:1.35}

main{padding:4px calc(16px + env(safe-area-inset-left)) 28px calc(16px + env(safe-area-inset-right))}
.pane{display:none}.pane.on{display:block}

/* status card */
.status{background:var(--card);border-radius:18px;padding:16px;margin:10px 0 14px}
.statrow{display:flex;gap:10px}
.stat{flex:1;background:var(--card2);border-radius:13px;padding:11px 8px;text-align:center}
.stat b{display:block;font-size:21px;font-weight:700;letter-spacing:-.4px}
.stat span{display:block;font-size:10.5px;color:var(--sec);margin-top:3px;letter-spacing:.2px}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:var(--card);color:var(--sec);border:0;border-radius:100px;
  padding:8px 14px;font-size:13.5px;font-weight:600;font-family:inherit;transition:.15s}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--blue);color:#fff}

/* cards */
.card{background:var(--card);border-radius:18px;overflow:hidden;margin-bottom:14px}
.art{display:block;width:100%;height:auto;background:#0d1b26;position:relative}
.art svg{display:block;width:100%;height:auto}
.art img.photo{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;z-index:2;display:block}
.credit{position:absolute;right:7px;bottom:6px;z-index:3;font-size:9.5px;color:rgba(255,255,255,.82);
  background:rgba(0,0,0,.45);padding:2px 6px;border-radius:6px;letter-spacing:.2px}
.body{padding:14px 15px 15px}
.ttl{font-size:17.5px;font-weight:700;letter-spacing:-.3px;line-height:1.25}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0 11px}
.tag{font-size:11px;font-weight:600;padding:4px 9px;border-radius:100px;
  background:var(--card2);color:var(--sec);letter-spacing:.1px;white-space:nowrap}
.tag.d{background:rgba(10,132,255,.16);color:#6ab4ff}
.tag.calm{background:rgba(48,209,88,.16);color:#178a45}
.tag.loud{background:rgba(255,159,10,.16);color:#b45309}
.tag.in{background:rgba(191,90,240,.16);color:#7c3aed}
.tag.chk{background:rgba(255,69,58,.16);color:#c0392b}

.kid{display:flex;gap:9px;margin-top:9px;align-items:flex-start}
.pill{flex:0 0 auto;width:44px;text-align:center;font-size:10.5px;font-weight:700;
  padding:3px 0;border-radius:7px;margin-top:1px;letter-spacing:.2px}
.pill.t{background:rgba(64,200,224,.18);color:#0891b2}
.pill.j{background:rgba(255,55,95,.18);color:#d6336c}
.kid p{margin:0;font-size:14px;line-height:1.42;color:#6f6a5e}

.note{margin-top:11px;padding-top:11px;border-top:1px solid var(--sep);
  font-size:13px;line-height:1.42;color:var(--sec)}
.acts{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;text-align:center;text-decoration:none;background:var(--card2);color:var(--blue);
  font-size:14px;font-weight:600;padding:10px;border-radius:12px;transition:.15s;display:block}
.btn:active{transform:scale(.96)}

.empty{text-align:center;color:var(--ter);font-size:14px;padding:40px 20px}
h2.sec{font-size:13px;font-weight:700;color:var(--sec);letter-spacing:.5px;
  text-transform:uppercase;margin:20px 4px 10px}

/* week */
.day{background:var(--card);border-radius:18px;padding:15px;margin-bottom:11px}
.dhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.dhead b{font-size:16.5px;font-weight:700;letter-spacing:-.2px}
.dhead span{font-size:12.5px;color:var(--ter);font-weight:600}
.dbook{margin-top:9px;background:var(--card2);border-radius:12px;padding:10px 12px;
  font-size:14px;font-weight:600;display:flex;gap:9px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.dsug{margin-top:9px;font-size:13.5px;color:var(--sec);line-height:1.45}
.dsug b{color:#6f6a5e;font-weight:600}

/* tab bar */
nav{position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:rgba(255,255,255,.9);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);
  border-top:.5px solid var(--sep);display:flex;
  padding:8px calc(6px + env(safe-area-inset-left)) calc(6px + env(safe-area-inset-bottom)) calc(6px + env(safe-area-inset-right))}
nav button{flex:1;background:none;border:0;color:var(--ter);font-family:inherit;
  font-size:10.5px;font-weight:600;letter-spacing:.1px;padding:4px 2px;
  display:flex;flex-direction:column;align-items:center;gap:3px;transition:.15s}
nav button:active{transform:scale(.92)}
nav button.on{color:var(--blue)}
nav svg{width:25px;height:25px;display:block}

#err{display:none;padding:20px;font:12px/1.5 ui-monospace,monospace;color:#c0392b;
  white-space:pre-wrap;word-break:break-word}
  .art{position:relative}
  .art img.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .gcar{position:absolute;inset:0;z-index:2}
  .gstrip{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;scrollbar-width:none}
  .gstrip::-webkit-scrollbar{display:none}
  .gstrip img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:center}
  .gdots{position:absolute;left:0;right:0;bottom:7px;display:flex;justify-content:center;gap:5px;
    pointer-events:none}
  .gdots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.55);
    box-shadow:0 0 3px rgba(0,0,0,.5);transition:background .2s}
  .gdots i.on{background:#fff}
  main{display:block}
  #photostat{margin:12px 16px 0}
  .pstat{background:#fff;border:1px solid var(--sep);border-radius:14px;padding:13px 15px;
    margin:0 0 14px;font-size:13.5px;color:var(--sec);line-height:1.5;
    box-shadow:0 1px 4px rgba(60,50,30,.08)}
  .pstat b{color:var(--label)}
  .pstat.nokey{background:#fbeedd;border-color:#f0d9b8;color:#9a5b00}
  .pstat.nokey b{color:#7a4700}
  .pbtn{display:block;margin-top:10px;background:var(--blue);color:#fff;border:0;
    border-radius:10px;padding:10px 16px;font:700 14px -apple-system,sans-serif}
  .pbtn:active{transform:scale(.97)}
</style>
</head>
<body>

<div id="err"></div>
<div id="photostat" class="pstat nokey">
  <b>📷 Photos</b><br>
  <span id="pstxt">Checking for a Google Maps key…</span>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <button class="pbtn" id="pkeybtn">Add key</button>
    <button class="pbtn" id="ptestbtn" style="background:#f0ece3;color:#20242c;display:none">Test key</button>
  </div>
  <div id="pkeyrow" style="display:none;margin-top:10px">
    <input id="pkeyin" type="text" inputmode="text" autocapitalize="off" autocorrect="off"
           spellcheck="false" placeholder="Paste your Google Maps key"
           style="width:100%;padding:11px 12px;border:1px solid var(--sep);border-radius:10px;
                  font:15px -apple-system,sans-serif;background:#fff;color:var(--label);-webkit-appearance:none">
    <div style="display:flex;gap:8px;margin-top:8px">
      <button class="pbtn" id="pkeysave">Save</button>
      <button class="pbtn" id="pkeyclear" style="background:#f0ece3;color:#20242c">Remove key</button>
      <button class="pbtn" id="pkeycancel" style="background:#f0ece3;color:#20242c">Cancel</button>
    </div>
  </div>
  <div id="ptest" style="margin-top:8px;font-size:12.5px;line-height:1.45"></div>
  <div id="pbuild" style="margin-top:8px;font-size:10px;opacity:.65"></div>
</div>
<header><h1 id="ttl">Near the park</h1><div class="sub" id="sb">Loading…</div></header>
<main>
  <div class="pane on" id="p-near"></div>
  <div class="pane" id="p-rain"></div>
  <div class="pane" id="p-big"></div>
  <div class="pane" id="p-week"></div>
</main>

<nav id="nav"></nav>

<script>
(function(){
"use strict";

window.onerror=function(m,s,l){
  try{
    var e=document.getElementById('err');
    var main=document.getElementById('p-near');
    if(e&&(!main||main.innerHTML.length<50)){
      e.style.display='block';
      e.textContent='Error: '+m+'\nline '+l;
    }
  }catch(x){}
};

/* ---------------- illustrations: flat vector scenes, no network ---------------- */
var P={sky1:'#0b2233',sky2:'#123a52',sun:'#b45309',sea:'#0e5a78',sea2:'#0a4359',
        sand:'#8a5a3a',sand2:'#a98a52',hill:'#1d4d3f',hill2:'#143a2f',rock:'#e5e0d5',
        dark:'#0a1620',white:'#20242c',warm:'#e8763a',pink:'#d6336c',green:'#3f8f56'};

function base(o){
  o=o||{};
  var skyA=o.skyA||P.sky1, skyB=o.skyB||P.sky2;
  var s='<svg viewBox="0 0 400 190" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">';
  s+='<rect width="400" height="190" fill="'+skyA+'"/>';
  s+='<rect y="0" width="400" height="96" fill="'+skyB+'" opacity=".55"/>';
  if(o.sun!==false) s+='<circle cx="'+(o.sx||326)+'" cy="'+(o.sy||42)+'" r="'+(o.sr||19)+'" fill="'+(o.sc||P.sun)+'" opacity=".9"/>';
  return s;
}
function hills(a,b){
  return '<path d="M0 108 L58 78 L112 100 L168 68 L232 104 L292 80 L344 102 L400 84 L400 190 L0 190Z" fill="'+(a||P.hill2)+'"/>'
       + '<path d="M0 126 L64 106 L128 124 L196 100 L264 126 L330 108 L400 124 L400 190 L0 190Z" fill="'+(b||P.hill)+'"/>';
}
function seaband(y){
  y=y||118;
  var s='<rect y="'+y+'" width="400" height="'+(190-y)+'" fill="'+P.sea+'"/>';
  s+='<path d="M0 '+(y+16)+' q26 -7 52 0 t52 0 t52 0 t52 0 t52 0 t52 0 t52 0" stroke="'+P.sea2+'" stroke-width="4" fill="none" opacity=".8"/>';
  s+='<path d="M0 '+(y+34)+' q30 -8 60 0 t60 0 t60 0 t60 0 t60 0 t60 0" stroke="'+P.sea2+'" stroke-width="4" fill="none" opacity=".6"/>';
  return s;
}
function beachband(y){
  y=y||150;
  return '<path d="M0 '+y+' q100 -12 200 0 t200 0 L400 190 L0 190Z" fill="'+P.sand+'"/>'
       + '<path d="M0 '+(y+18)+' q100 -10 200 0 t200 0 L400 190 L0 190Z" fill="'+P.sand2+'" opacity=".55"/>';
}
function end(){return '</svg>';}

var M={};
M.arcade=function(){return base({skyA:'#1a1030',skyB:'#2b1550',sun:false})
  +'<rect y="120" width="400" height="70" fill="#1b1236"/>'
  +'<rect x="70" y="52" width="260" height="98" rx="12" fill="#f0ece3"/>'
  +'<rect x="86" y="68" width="228" height="52" rx="7" fill="'+P.sky1+'"/>'
  +'<circle cx="122" cy="94" r="9" fill="'+P.warm+'"/><circle cx="158" cy="94" r="9" fill="'+P.sun+'"/><circle cx="194" cy="94" r="9" fill="#0891b2"/><circle cx="230" cy="94" r="9" fill="'+P.pink+'"/><circle cx="266" cy="94" r="9" fill="#178a45"/>'
  +'<rect x="118" y="128" width="164" height="12" rx="6" fill="#e5e0d5"/>'
  +'<circle cx="90" cy="44" r="4" fill="'+P.sun+'"/><circle cx="312" cy="40" r="4" fill="'+P.pink+'"/><circle cx="200" cy="32" r="4" fill="#0891b2"/>'+end();};
M.golf=function(){return base()+hills()
  +'<path d="M0 132 q200 -22 400 0 L400 190 L0 190Z" fill="#2f7a4a"/>'
  +'<ellipse cx="252" cy="164" rx="17" ry="7" fill="#123a24"/>'
  +'<rect x="250" y="118" width="4" height="46" fill="'+P.white+'"/>'
  +'<path d="M254 118 l32 11 l-32 11z" fill="'+P.warm+'"/>'
  +'<circle cx="116" cy="162" r="8" fill="'+P.white+'"/>'
  +'<path d="M96 168 q20 -30 132 -6" stroke="'+P.white+'" stroke-width="2" fill="none" stroke-dasharray="5 6" opacity=".6"/>'+end();};
M.horse=function(){return base({skyA:'#1c2438',skyB:'#3a4a63',sc:'#b45309'})+seaband(116)+beachband(140)
  +'<g fill="#8a5a3a">'
  +'<rect x="148" y="150" width="9" height="30" rx="4"/><rect x="168" y="152" width="9" height="28" rx="4"/>'
  +'<rect x="206" y="150" width="9" height="30" rx="4"/><rect x="224" y="152" width="9" height="28" rx="4"/>'
  +'<ellipse cx="190" cy="144" rx="46" ry="21"/>'
  +'<path d="M222 138 q10 -12 16 -30 l6 -18 l16 6 l-8 22 q-6 20 -20 26z"/>'
  +'<path d="M252 90 q16 -2 20 10 l-8 14 l-22 -8z"/>'
  +'</g>'
  +'<path d="M144 138 q-16 6 -20 30 q12 -14 24 -20z" fill="#5c3a24"/>'
  +'<path d="M240 96 q10 -22 22 -26 q-4 16 -8 30z" fill="#5c3a24"/>'
  +'<path d="M256 84 l-2 -12 l8 7z" fill="#8a5a3a"/><path d="M266 86 l3 -12 l6 9z" fill="#8a5a3a"/>'
  +'<circle cx="264" cy="98" r="2.6" fill="#ffffff"/>'
  +'<g><circle cx="196" cy="106" r="9" fill="#8a5a3a"/><path d="M188 116 l16 0 l7 26 l-30 0z" fill="'+P.warm+'"/></g>'+end();};
M.surf=function(){return base({skyA:'#0d2b3a',skyB:'#17506b'})
  +'<rect y="96" width="400" height="94" fill="'+P.sea+'"/>'
  +'<path d="M0 132 q56 -46 118 -10 q46 26 96 0 q56 -30 108 4 q40 20 78 -6 L400 190 L0 190Z" fill="'+P.sea2+'"/>'
  +'<path d="M0 154 q70 -22 140 2 q70 24 140 -2 q60 -22 120 2 L400 190 L0 190Z" fill="#083a4e"/>'
  +'<g fill="#20242c"><ellipse cx="196" cy="112" rx="9" ry="30" transform="rotate(-26 196 112)"/></g>'
  +'<g fill="#ffffff"><circle cx="186" cy="92" r="7"/><path d="M180 100 l14 0 l6 22 l-26 0z"/></g>'
  +'<path d="M0 176 q40 -9 80 0 t80 0 t80 0 t80 0 t80 0" stroke="'+P.white+'" stroke-width="3" fill="none" opacity=".55"/>'+end();};
M.aquarium=function(){return base({skyA:'#e6f2f7',skyB:'#073349',sun:false})
  +'<rect y="0" width="400" height="190" fill="#062e42"/>'
  +'<g opacity=".5"><path d="M40 190 q10 -60 -4 -100" stroke="#0f6f7a" stroke-width="9" fill="none"/><path d="M64 190 q-8 -50 6 -84" stroke="#0f6f7a" stroke-width="7" fill="none"/><path d="M348 190 q12 -56 -2 -92" stroke="#0f6f7a" stroke-width="9" fill="none"/></g>'
  +'<g fill="'+P.warm+'"><path d="M150 92 q22 -16 44 0 q-22 16 -44 0z"/><path d="M150 92 l-14 -11 l0 22z"/></g>'
  +'<circle cx="182" cy="88" r="2.4" fill="#e6f2f7"/>'
  +'<g fill="'+P.sun+'"><path d="M226 124 q16 -11 32 0 q-16 11 -32 0z"/><path d="M226 124 l-10 -8 l0 16z"/></g>'
  +'<g fill="'+P.pink+'"><path d="M108 148 q14 -10 28 0 q-14 10 -28 0z"/><path d="M108 148 l-9 -7 l0 14z"/></g>'
  +'<g fill="#7fe3f0" opacity=".7"><circle cx="272" cy="60" r="4"/><circle cx="284" cy="40" r="3"/><circle cx="276" cy="24" r="2"/></g>'+end();};
M.boat=function(){return base({skyA:'#182a44',skyB:'#2e4a6b',sc:'#b45309'})+seaband(120)
  +'<path d="M124 148 l152 0 l-20 22 l-112 0z" fill="#d8d3c6"/>'
  +'<rect x="196" y="86" width="5" height="62" fill="#8d8676"/>'
  +'<path d="M201 90 l44 52 l-44 0z" fill="'+P.white+'"/>'
  +'<path d="M196 96 l-34 46 l34 0z" fill="'+P.warm+'"/>'
  +'<path d="M0 176 q40 -9 80 0 t80 0 t80 0 t80 0 t80 0" stroke="'+P.sea2+'" stroke-width="4" fill="none"/>'+end();};
M.castle=function(){return base({skyA:'#191a2e',skyB:'#2d2b4c'})+hills('#242a1e','#1a1f16')
  +'<g fill="#b9b2a2">'
  +'<rect x="120" y="82" width="160" height="80"/>'
  +'<rect x="96" y="60" width="40" height="102"/><rect x="264" y="60" width="40" height="102"/>'
  +'<path d="M96 60 h40 v-10 h-8 v6 h-8 v-6 h-8 v6 h-8v-6h-8z"/>'
  +'<path d="M264 60 h40 v-10 h-8 v6 h-8 v-6 h-8 v6 h-8v-6h-8z"/>'
  +'</g>'
  +'<g fill="#7b7466"><rect x="140" y="98" width="16" height="24" rx="8"/><rect x="192" y="98" width="16" height="24" rx="8"/><rect x="244" y="98" width="16" height="24" rx="8"/></g>'
  +'<path d="M182 162 l0 -32 q18 -18 36 0 l0 32z" fill="#4a3a2a"/>'
  +'<rect x="108" y="34" width="3" height="28" fill="#b9b2a2"/><path d="M111 34 l22 7 l-22 7z" fill="'+P.pink+'"/>'
  +'<rect y="162" width="400" height="28" fill="#242a1e"/>'+end();};
M.dino=function(){return base({skyA:'#22301c',skyB:'#39492c',sc:'#b45309'})+hills('#1d2a18','#16210f')
  +'<g fill="#2f6b46">'
  +'<path d="M78 168 q10 -54 62 -60 q40 -5 62 20 q18 20 46 20 l0 20z"/>'
  +'<path d="M186 128 q26 -46 62 -40 q26 5 22 30 q-3 20 -26 22 z"/>'
  +'<path d="M240 118 q26 -6 40 6 q-14 12 -40 6z"/>'
  +'<path d="M78 168 q-34 -8 -56 -34 q26 8 52 12z"/>'
  +'</g>'
  +'<g fill="#1e4a30"><path d="M120 112 l10 -18 l10 18z"/><path d="M146 104 l10 -18 l10 18z"/><path d="M172 104 l10 -18 l10 18z"/></g>'
  +'<circle cx="260" cy="108" r="3.2" fill="#b45309"/>'
  +'<rect y="168" width="400" height="22" fill="#1d2a18"/>'+end();};
M.zoo=function(){return base({skyA:'#1d2a35',skyB:'#2f4756',sc:'#b45309'})+hills('#233326','#1a281d')
  +'<g fill="'+P.sun+'"><path d="M156 172 l0 -46 q0 -22 22 -22 q22 0 22 22 l0 46 l-11 0 l0 -34 l-22 0 l0 34z"/>'
  +'<path d="M188 108 q6 -34 22 -44 l10 8 q-12 12 -16 38z"/></g>'
  +'<g fill="#8a6a2a"><circle cx="164" cy="140" r="6"/><circle cx="180" cy="156" r="5"/><circle cx="192" cy="132" r="5"/><circle cx="214" cy="76" r="4"/></g>'
  +'<path d="M216 68 l-3 -12 l8 6z" fill="'+P.sun+'"/><circle cx="222" cy="72" r="2.4" fill="#ffffff"/>'
  +'<g fill="#2f6b46"><circle cx="70" cy="122" r="30"/><rect x="66" y="122" width="8" height="50"/><circle cx="330" cy="132" r="24"/><rect x="326" y="132" width="8" height="40"/></g>'
  +'<rect y="170" width="400" height="20" fill="#233326"/>'+end();};
M.softplay=function(){return base({skyA:'#241338',skyB:'#3a1c5c',sun:false})
  +'<rect y="0" width="400" height="190" fill="#251442"/>'
  +'<g><circle cx="70" cy="150" r="20" fill="'+P.warm+'"/><circle cx="118" cy="164" r="16" fill="'+P.sun+'"/><circle cx="160" cy="146" r="18" fill="#0891b2"/><circle cx="206" cy="166" r="15" fill="'+P.pink+'"/><circle cx="248" cy="148" r="19" fill="#178a45"/><circle cx="296" cy="164" r="16" fill="#7c3aed"/><circle cx="340" cy="148" r="18" fill="'+P.warm+'"/></g>'

var mapsUrl=function(n){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(n+', Devon, UK');};
var picsUrl=function(n){return 'https://www.google.com/search?tbm=isch&q='+encodeURIComponent(n+' Devon');};
var toneLabel={calm:'Calm',mixed:'Mixed',loud:'Loud'};
var indLabel={0:'Outdoor',1:'Indoor',2:'Indoor + out'};

/* Drop a photo at img/<slug>.jpg and it replaces the illustration automatically.
   Nothing is required — a missing file simply leaves the drawing in place.
   Add a line to CREDITS to show an attribution caption over the photo. */
function slug(n){
  return n.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
}
var CREDITS={
  /* "the-big-sheep": "© The BIG Sheep" */
};

function dist(x){
  if(x.walk) return x.min+' min walk';
  return x.min+' min drive';
}
function card(x){
  var sl=slug(x.n);
  var t='';
  t+='<div class="card">';
  t+='<div class="art" data-slug="'+sl+'">'+art(x.sc);
  t+='<img class="photo" loading="lazy" alt="" src="img/'+sl+'.jpg" '
    +'onerror="this.parentNode.querySelectorAll(\'.credit\').forEach(function(c){c.remove()});this.remove();">';
  if(CREDITS[sl]) t+='<span class="credit">'+CREDITS[sl]+'</span>';
  t+='</div>';
  t+='<div class="body">';
  t+='<div class="ttl">'+x.n+'</div>';
  t+='<div class="tags">';
  t+='<span class="tag d">'+(x.walk?'Walkable':x.mi+' mi')+'</span>';
  t+='<span class="tag d">'+dist(x)+'</span>';
  t+='<span class="tag'+(x.ind?' in':'')+'">'+indLabel[x.ind]+'</span>';
  t+='<span class="tag '+(x.tone==='calm'?'calm':x.tone==='loud'?'loud':'')+'">'+toneLabel[x.tone]+'</span>';
  if(x.chk) t+='<span class="tag chk">Verify first</span>';
  t+='</div>';
  t+='<div class="kid"><span class="pill t">Theo</span><p>'+x.theo+'</p></div>';
  t+='<div class="kid"><span class="pill j">Josh</span><p>'+x.josh+'</p></div>';
  t+='<div class="note">'+x.note+'</div>';
  t+='<div class="acts">';
  t+='<a class="btn" href="'+mapsUrl(x.n)+'" target="_blank" rel="noopener">Maps</a>';
  t+='<a class="btn" href="'+picsUrl(x.n)+'" target="_blank" rel="noopener">Photos</a>';
  if(x.url) t+='<a class="btn" href="'+x.url+'" target="_blank" rel="noopener">Site</a>';
  t+='</div></div></div>';
  return t;
}

var CATS=['All','Active','Attraction','Animals','Rainy','Ride','Making','Walkable'];
var curCat='All';

function renderNear(){
  var el=document.getElementById('p-near');
  var list=D.slice().sort(function(a,b){return a.min-b.min;});
  var shown=curCat==='All'?list:list.filter(function(x){
    if(curCat==='Walkable') return !!x.walk;
    if(curCat==='Rainy') return x.cat==='Rainy'||x.ind===1;
    return x.cat===curCat;
  });
  var walkable=D.filter(function(x){return x.walk;}).length;
  var under30=D.filter(function(x){return x.min<=30;}).length;
  var h='';
  h+='<div class="status"><div class="statrow">'
   +'<div class="stat"><b>'+D.length+'</b><span>ACTIVITIES</span></div>'
   +'<div class="stat"><b>'+walkable+'</b><span>WALKABLE</span></div>'
   +'<div class="stat"><b>'+under30+'</b><span>UNDER 30 MIN</span></div>'
   +'<div class="stat"><b>65</b><span>MAX MINS</span></div>'
   +'</div></div>';
  h+='<div class="chips">';
  CATS.forEach(function(c){h+='<button class="chip'+(c===curCat?' on':'')+'" data-cat="'+c+'">'+c+'</button>';});
  h+='</div>';
  if(!shown.length) h+='<div class="empty">Nothing in that category.</div>';
  shown.forEach(function(x){h+=card(x);});
  el.innerHTML=h;
  var cs=el.querySelectorAll('.chip');
  for(var i=0;i<cs.length;i++){
    cs[i].addEventListener('click',function(){curCat=this.getAttribute('data-cat');renderNear();window.scrollTo(0,0);});
  }
}
function renderRain(){
  var el=document.getElementById('p-rain');
  var list=D.filter(function(x){return x.ind>0;}).sort(function(a,b){return a.min-b.min;});
  var h='<div class="status"><div class="statrow">'
   +'<div class="stat"><b>'+list.length+'</b><span>WET OPTIONS</span></div>'
   +'<div class="stat"><b>'+list.filter(function(x){return x.ind===1;}).length+'</b><span>FULLY INDOOR</span></div>'
   +'<div class="stat"><b>'+list.filter(function(x){return x.tone==="calm";}).length+'</b><span>CALM ONES</span></div>'
   +'</div></div>';
  h+='<h2 class="sec">Nearest first</h2>';
  list.forEach(function(x){h+=card(x);});
  el.innerHTML=h;
}
function renderBig(){
  var el=document.getElementById('p-big');
  var list=D.filter(function(x){return x.big;}).sort(function(a,b){return a.min-b.min;});
  var h='<div class="status"><div class="statrow">'
   +'<div class="stat"><b>'+list.length+'</b><span>FULL DAYS</span></div>'

   Uses the SAME key you saved in the road trip app (localStorage

   ============================================================ */
var GKEY = "";
try { GKEY = localStorage.getItem("gmaps-key-v1") || ""; } catch (e) {}
var GON = !!GKEY && GKEY.length > 20;

var GPIC = {};
try { GPIC = JSON.parse(localStorage.getItem("wool-photos-v1") || "{}"); } catch (e) {}
function savePics(){ try { localStorage.setItem("wool-photos-v1", JSON.stringify(GPIC)); } catch (e) {} }

var picQueue = [], picBusy = false, picAsked = {};

/* Cache Storage keeps the actual image BYTES on the device, so a photo is
   only ever downloaded from Google once. Quota is tens of MB (localStorage
   would be far too small). Falls back to a plain <img> if unavailable. */
var BUILD = '2026-08-13e';
var IMGCACHE = 'wool-img-v1';
var canCache = (typeof caches !== 'undefined');

function setSrc(img, url){
  if (!canCache) { img.src = url; return; }
  caches.open(IMGCACHE).then(function(c){
    return c.match(url).then(function(hit){
      if (hit) return hit.blob();
      return fetch(url).then(function(res){
        if (res && res.ok) { try { c.put(url, res.clone()); } catch(e){} }
        return res.blob();
      });
    });
  }).then(function(b){
    img.src = URL.createObjectURL(b);
  }).catch(function(){ img.src = url; });
}

/* Only the first photo loads up front. The other five are fetched the moment
   you actually swipe — so cards you never touch cost one photo, not six. */
function expandStrip(strip, urls){
  if (strip.getAttribute('data-full')) return;
  strip.setAttribute('data-full','1');
  for (var i = 1; i < urls.length; i++) {
    var im = document.createElement('img');
    im.decoding = 'async'; im.alt = '';
    im.onerror = function(){ this.remove(); };
    setSrc(im, urls[i]);
    strip.appendChild(im);
  }
}

function paintPhotos(){
  try {
    var arts = document.querySelectorAll('.art[data-slug]');
    Array.prototype.forEach.call(arts, function(el){
      var sl = el.getAttribute('data-slug');
      var urls = GPIC[sl];
      if (!urls || !urls.length || el.querySelector('.gcar')) return;

      var wrap = document.createElement('div');
      wrap.className = 'gcar';

      var strip = document.createElement('div');
      strip.className = 'gstrip';
      var first = document.createElement('img');
      first.decoding = 'async'; first.alt = '';
      first.onerror = function(){
        var s = this.parentNode; this.remove();
        if (s && !s.querySelector('img')) { var w = s.parentNode; if (w) w.remove(); }
        syncDots(wrap);
      };
      setSrc(first, urls[0]);
      strip.appendChild(first);
      if (urls.length > 1) {
        var grow = function(){ expandStrip(strip, urls); };
        strip.addEventListener('touchstart', grow, { passive: true, once: true });
        strip.addEventListener('mouseenter', grow, { once: true });
        strip.addEventListener('scroll', grow, { passive: true, once: true });
      }
      wrap.appendChild(strip);

      if (urls.length > 1) {
        var dots = document.createElement('div');
        dots.className = 'gdots';
        urls.forEach(function(_, i){
          var d = document.createElement('i');
          if (!i) d.className = 'on';
          dots.appendChild(d);
        });
        wrap.appendChild(dots);
        strip.addEventListener('scroll', function(){
          var w = strip.clientWidth || 1;
          var idx = Math.round(strip.scrollLeft / w);
          var ds = dots.querySelectorAll('i');
          for (var i = 0; i < ds.length; i++) ds[i].className = (i === idx ? 'on' : '');
        }, { passive: true });
      }
      el.appendChild(wrap);
    });
  } catch (e) {}
  try { photoStatus(); } catch (e) {}
}
function syncDots(wrap){
  try{
    var n = wrap.querySelectorAll('.gstrip img').length;
    var d = wrap.querySelector('.gdots');
    if (d && n < 2) d.remove();
  }catch(e){}
}

function fetchPic(name, sl){
  return fetch('https://places.googleapis.com/v1/places:searchText', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'X-Goog-Api-Key': GKEY,
      'X-Goog-FieldMask': 'places.photos,places.displayName'
    },
    body: JSON.stringify({ textQuery: name + ', North Devon, UK', maxResultCount: 1 })
  }).then(function(r){
    if (!r.ok) throw new Error(r.status);
    return r.json();
  }).then(function(j){
    var ph = (j.places && j.places[0] && j.places[0].photos) || [];
    var urls = ph.slice(0, 6).map(function(x){
      return 'https://places.googleapis.com/v1/' + x.name + '/media?maxWidthPx=600&key=' + GKEY;
    });
    GPIC[sl] = urls.length ? urls : null;
    savePics();
  }).catch(function(){ GPIC[sl] = null; savePics(); });
}

function drainPics(){
  if (picBusy || !GON) return;
  picBusy = true;
  var landed = false;
  function next(){
    if (!picQueue.length) {
      picBusy = false;
      if (landed) paintPhotos();
      return;
    }
    var job = picQueue.shift();
    fetchPic(job.n, job.sl).then(function(){
      if (GPIC[job.sl]) landed = true;
      setTimeout(next, 250);           /* gentle on the quota */
    });
  }
  next();
}

/* Called after every render: paint what we have, queue what's visible. */
function photosPass(){
  paintPhotos();
  if (!GON) return;
  try {
    var arts = document.querySelectorAll('.art[data-slug]');
    var added = 0;
    Array.prototype.forEach.call(arts, function(el){
      if (added >= 8) return;
      var sl = el.getAttribute('data-slug');
      if (picAsked[sl] || GPIC[sl] !== undefined) return;
      var t = el.parentNode.querySelector('.ttl');
      if (!t) return;
      picAsked[sl] = 1;
      picQueue.push({ n: t.textContent, sl: sl });
      added++;
    });
    if (picQueue.length) drainPics();
  } catch (e) {}
  try { photoStatus(); } catch (e) {}
}

/* The whole file runs inside an IIFE, so these functions are local — wrap them
   directly rather than via window, which is empty here. */
var _rn = renderNear, _rr = renderRain, _rb = renderBig, _rw = renderWeek, _st = setTab;
renderNear = function(){ var r = _rn.apply(this, arguments); setTimeout(photosPass, 0); return r; };
renderRain = function(){ var r = _rr.apply(this, arguments); setTimeout(photosPass, 0); return r; };
renderBig  = function(){ var r = _rb.apply(this, arguments); setTimeout(photosPass, 0); return r; };
renderWeek = function(){ var r = _rw.apply(this, arguments); setTimeout(photosPass, 0); return r; };
setTab     = function(){ var r = _st.apply(this, arguments); setTimeout(photosPass, 0); return r; };

/* Belt and braces: anything that repaints the list also triggers a pass. */
try {
  var _obsTarget = document.body;
  if (window.MutationObserver && _obsTarget) {
    var _mo = new MutationObserver(function(){
      clearTimeout(window.__wpT);
      window.__wpT = setTimeout(photosPass, 120);
    });
    _mo.observe(_obsTarget, { childList: true, subtree: true });
  }
} catch (e) {}

photoStatus();                 /* paint the banner before anything else happens */
setTimeout(photosPass, 60);
setTimeout(photosPass, 800);

/* Photo status — a proper banner at the top of the visible pane, not a
   floating pill. Includes key entry so there's no need to switch apps. */
function applyKey(v){
  v = (v || '').trim();
  try { v ? localStorage.setItem('gmaps-key-v1', v) : localStorage.removeItem('gmaps-key-v1'); } catch(e){}
  GKEY = v; GON = !!v && v.length > 20;
  GPIC = {}; picAsked = {}; picQueue = [];
  try { localStorage.removeItem('wool-photos-v1'); } catch(e){}
  var row = document.getElementById('pkeyrow'); if (row) row.style.display = 'none';
  var t = document.getElementById('ptest');
  if (t) t.innerHTML = v ? '<b>Key saved.</b> Photos will appear as you scroll.'
                         : '<b>Key removed.</b> Back to the drawn artwork.';
  photosPass();
}
function keyPrompt(){
  /* No prompt() — iOS blocks it in Home Screen web apps. Inline field instead. */
  var row = document.getElementById('pkeyrow');
  var inp = document.getElementById('pkeyin');
  if (!row || !inp) return;
  var showing = row.style.display !== 'none';
  row.style.display = showing ? 'none' : 'block';
  if (!showing) { inp.value = GKEY || ''; try { inp.focus(); } catch(e){} }
}

function explainG(status, body){
  var b = (body || '').slice(0, 300);
  if (status === 403 && /referer|referrer|API_KEY_HTTP_REFERRER/i.test(b))
    return 'Your key is locked to a different website. Add <b>' + location.origin + '/*</b> to the key\'s Website restrictions.';
  if (status === 403 && /not enabled|SERVICE_DISABLED|disabled/i.test(b))
    return 'The <b>Places API</b> is not switched on for this key. Enable it in the Maps API Library.';
  if (status === 403) return 'Key rejected — usually the Places API is off, or the website restriction excludes this address.';
  if (status === 429 || /RESOURCE_EXHAUSTED|quota/i.test(b))
    return 'Daily quota reached. That is your spending cap working — it resets tomorrow.';
  if (status === 400) return 'Request refused — the key may be mistyped or have a stray space.';
  return 'Unexpected response (' + status + ').';
}

function testKey(){
  var out = document.getElementById('ptest');
  if (!out) return;
  if (!GON) { out.innerHTML = '<b>No key installed.</b> Tap “Add key” first.'; return; }
  out.innerHTML = 'Testing…';
  fetch('https://places.googleapis.com/v1/places:searchText', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'X-Goog-Api-Key': GKEY,
      'X-Goog-FieldMask': 'places.photos,places.displayName'
    },
    body: JSON.stringify({ textQuery: 'Exmoor Zoo, North Devon, UK', maxResultCount: 1 })
  }).then(function(r){
    return r.text().then(function(t){ return { ok: r.ok, status: r.status, t: t }; });
  }).then(function(r){
    if (!r.ok) { out.innerHTML = '<b>❌ Failed (' + r.status + ')</b><br>' + explainG(r.status, r.t); return; }
    var j = JSON.parse(r.t);
    var p = j.places && j.places[0];
    var n = (p && p.photos) ? p.photos.length : 0;
    out.innerHTML = '<b>✅ Working.</b> Found “' + (p ? p.displayName.text : '?') + '” with ' + n +
      ' photo' + (n === 1 ? '' : 's') + '. Scroll and they will fill in.';
  }).catch(function(){
    out.innerHTML = '<b>❌ Could not reach Google.</b> No signal, or the request was blocked.';
  });
}

function photoStatus(){
  try{
    var box = document.getElementById('photostat');
    if (!box) return;
    var txt = document.getElementById('pstxt');
    var keyb = document.getElementById('pkeybtn');
    var testb = document.getElementById('ptestbtn');
    var bld = document.getElementById('pbuild');

    var got = 0, tried = 0;
    for (var k in GPIC) { tried++; if (GPIC[k]) got++; }

    if (GON) {
      box.className = 'pstat';
      if (txt) txt.innerHTML = 'On · key ' + GKEY.slice(0,6) + '…' + GKEY.slice(-4)
        + '<br>' + got + ' of ' + tried + ' places looked up'
        + (picQueue.length ? ' · ' + picQueue.length + ' loading' : '');
      if (keyb) keyb.textContent = 'Change key';
      if (testb) testb.style.display = '';
    } else {
      box.className = 'pstat nokey';
      if (txt) txt.textContent = 'Off — add a Google Maps key and every activity gets real photographs instead of the drawn artwork.';
      if (keyb) keyb.textContent = 'Add key';
      if (testb) testb.style.display = 'none';
    }
    if (bld) bld.textContent = 'build ' + BUILD + ' · this page: ' + location.origin + '/*';
    if (keyb) keyb.onclick = keyPrompt;
    if (testb) testb.onclick = testKey;
    var sv = document.getElementById('pkeysave');
    var cl = document.getElementById('pkeyclear');
    var cn = document.getElementById('pkeycancel');
    if (sv) sv.onclick = function(){ applyKey((document.getElementById('pkeyin')||{}).value); };
    if (cl) cl.onclick = function(){ applyKey(''); };
    if (cn) cn.onclick = function(){ var r=document.getElementById('pkeyrow'); if(r) r.style.display='none'; };
  }catch(e){}
}

photoStatus();                 /* paint the banner before anything else happens */
setTimeout(photosPass, 60);
setTimeout(photosPass, 800);

/* Tiny status line so photo problems are self-diagnosing. */
})();

</script>
</body>
</html>
